<div class="centerbox">

    <!-- Форма ввода -->
    <div class="box" id="calcBox">

        <div class="boxtitle">Калькулятор часов</div>

        <br>

        Дата начала<br>
        <input type="date" id="date1">

        <br><br>

        Время начала<br>
        <input type="time" id="time1">

        <br><br>

        Дата конца<br>
        <input type="date" id="date2">

        <br><br>

        Время конца<br>
        <input type="time" id="time2">

        <br><br>

        <input type="submit" value="Посчитать" id="calcBtn">
        <input type="button" value="Сбросить" onclick="resetFull()">

    </div>

    <!-- Панель результата, изначально скрыта -->
    <div class="box" id="resultBox" style="display:none;">

        <div id="result"></div>

        <br>

        <input type="button" value="Сначала" onclick="resetForm()">

    </div>

</div>

<style>
.centerbox {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    user-select: none;
}

.box {
    width: 340px;
    text-align: center;
    background-color: #353535;
    padding: 15px;
    border-radius: 10px;
}

/* тёмная тема календаря */
input[type="date"],
input[type="time"] {
    color: #E3E3E3;
    background: #353535;
    border-radius: 6px;
    border-left: 2px solid #03A4FF;
    border-right: 2px solid #03A4FF;
    border-bottom: 2px solid #0076BB;
    border-top: 2px solid #59C3FF;
    padding: 6px;
    width: 200px;
    color-scheme: dark;
}

/* кнопки */
input[type="submit"],
input[type="button"] {
    color: #E3E3E3;
    border-radius: 6px;
    background-color: #5B5B5B;
    margin: 5px;
    padding: 6px 28px;
    border-left: 2px solid #03A4FF;
    border-right: 2px solid #03A4FF;
    border-bottom: 2px solid #0076BB;
    border-top: 2px solid #33B5FF;
    font-size: 15px;
    cursor: pointer;
}

input[type="submit"]:hover,
input[type="button"]:hover {
    border-top: 2px solid #59C3FF;
    background-image: linear-gradient(180deg, rgba(89,195,255,1) 0%, rgba(0,118,187,1) 100%);
    color: #434343;
}

#result {
    font-size: 18px;
    margin-top: 20px;
    font-weight: normal;
    text-align: center;
    color: #E3E3E3;
}
</style>

<script>
document.getElementById("calcBtn").onclick = calcTime;

function calcTime() {
    let d1 = document.getElementById("date1").value;
    let t1 = document.getElementById("time1").value;
    let d2 = document.getElementById("date2").value;
    let t2 = document.getElementById("time2").value;

    if (!d1 || !t1 || !d2 || !t2) {
        alert("Заполните все поля");
        return;
    }

    let start = new Date(d1 + "T" + t1);
    let end = new Date(d2 + "T" + t2);

    let diff = end - start;

    if (diff < 0) {
        alert("Конечная дата и время раньше начальной!");
        return;
    }
    
    let minutes = Math.floor(diff / 60000) % 60;
    let hours = Math.floor(diff / 3600000);

    document.getElementById("result").innerHTML =
        "Прошло: " + hours + " часов, " + minutes + " минут";

    document.getElementById("calcBox").style.display = "none";
    document.getElementById("resultBox").style.display = "block";
}

// Сначала — скрываем результат, форма остаётся с введёнными данными
function resetForm() {
    document.getElementById("resultBox").style.display = "none";
    document.getElementById("calcBox").style.display = "block";
    document.getElementById("result").innerHTML = "";
}

// Полный сброс — очищает все поля
function resetFull() {
    document.getElementById("date1").value = "";
    document.getElementById("time1").value = "";
    document.getElementById("date2").value = "";
    document.getElementById("time2").value = "";
    document.getElementById("result").innerHTML = "";
    document.getElementById("calcBox").style.display = "block";
    document.getElementById("resultBox").style.display = "none";
}
</script>
